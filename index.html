<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Randomizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stats-bar">
      <span>High Score: <span id="highScore">0</span></span>
      <span>|</span>
      <span>Lives: <span id="lives">3</span></span>
      <span>|</span>
      <span class="timer-label">Time: <span id="timerDisplay">5.0</span>s</span>
    </div>

    <div class="container" id="gameContainer">
      <div id="dynamicImg"></div>
      <div id="staticImg"></div>
    </div>

    <div class="score-board">
      <p class="correct-text">Correct: <span id="correctCount">0</span></p>
      <p class="wrong-text">Wrong: <span id="wrongCount">0</span> / 3</p>
      <p id="statusMsg" class="status-msg"></p>
    </div>

    <div class="controls-row">
      <div>
        <label for="speedSelect">Speed: </label>
        <select id="speedSelect" onchange="changeSpeed()">
          <option value="300">Slow (300ms)</option>
          <option value="150" selected>Normal (150ms)</option>
          <option value="70">Fast (70ms)</option>
        </select>
      </div>

      <button
        type="button"
        id="muteBtn"
        class="mute-btn"
        onclick="toggleMute()"
      >
        Sound: ON
      </button>
    </div>

    <button onclick="stopGame()" id="btn" class="main-btn">Stop</button>
    <p class="hint-text">Click the button or press <strong>Spacebar</strong></p>

    <script src="script.js"></script>
  </body>
</html>
