<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Randomizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      style="margin-bottom: 12px; font-weight: bold; display: flex; gap: 15px"
    >
      <span>High Score: <span id="highScore">0</span></span>
      <span>|</span>
      <span>Lives: <span id="lives">3</span></span>
      <span>|</span>
      <span style="color: blueviolet"
        >Time: <span id="timerDisplay">5.0</span>s</span
      >
    </div>

    <div class="container" id="gameContainer">
      <div id="dynamicImg"></div>
      <div id="staticImg"></div>
    </div>

    <div>
      <p class="sax">Correct: <span id="correctCount">0</span></p>
      <p class="qalad">Wrong: <span id="wrongCount">0</span> / 3</p>
      <p
        id="statusMsg"
        style="font-weight: bold; margin-top: 8px; min-height: 28px"
      ></p>
    </div>

    <div
      style="margin-top: 10px; display: flex; align-items: center; gap: 12px"
    >
      <div>
        <label for="speedSelect">Speed: </label>
        <select id="speedSelect" onchange="changeSpeed()">
          <option value="300">Slow (300ms)</option>
          <option value="150" selected>Normal (150ms)</option>
          <option value="70">Fast (70ms)</option>
        </select>
      </div>

      <button
        type="button"
        id="muteBtn"
        onclick="toggleMute()"
        style="
          margin-top: 0;
          padding: 6px 14px;
          font-size: 14px;
          background-color: #2ecc71;
        "
      >
        Sound: ON
      </button>
    </div>

    <button onclick="stopGame()" id="btn">Stop</button>
    <p style="font-size: 14px; color: #555; margin-top: 8px">
      Click the button or press <strong>Spacebar</strong>
    </p>

    <script src="script.js"></script>
  </body>
</html>
